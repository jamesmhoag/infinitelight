txtApply(); // the page's own labels (content/strings.csv)

const CACHE_V='20261104u'; // the build: bump with shared.js's

const MAP_KEY='il_map_v1';

const K=(q,r)=>q+','+r;
const parseK=k=>{const p=k.split(',');return[+p[0],+p[1]];};

function p2a(sx,sy){const[wx,wy]=s2w(sx,sy);const q=(Math.sqrt(3)/3*wx-1/3*wy)/HEX,r=(2/3*wy)/HEX;const s=-q-r;let rq=Math.round(q),rr=Math.round(r),rs=Math.round(s);const dq=Math.abs(rq-q),dr=Math.abs(rr-r),ds=Math.abs(rs-s);if(dq>dr&&dq>ds)rq=-rr-rs;else if(dr>ds)rr=-rq-rs;return[rq,rr];}

function retractToTurn(){
  const maxRing=turn;const toRemove=[];
  for(const k in cells){const c=cells[k];if(c.isVoid||cellRing(c.q,c.r)<=maxRing||c.cap||c.isP)continue;toRemove.push(k);}

function dropSession(){ // the unfinished surface is thrown away (values changed, or a new map)

}
function redistribute(){

}
function decayCycle(){

    const oldest=captureOrder.shift();
    for(const k of oldest.keys){const c=cells[k];if(!c)continue;c.cap=false;c.capVal=0;c.isVoid=true;c.mergeId=null;c.v=0;delete c.kind;}
    if(oldest.mergeId!=null)mergeGroups=mergeGroups.filter(g=>g.id!==oldest.mergeId);

}
function detectMerges(){

    if(d3){totalRed+=3;mergeFx.push({gid,t0:performance.now()});showMergeFlash(txt('map.three_dark_remnants_become'));}else{totalRed+=1;showMergeFlash(txt('map.merge_rings_1'));}}}} // three Dark Remnants swirl into one great one: three times the pull
  if(totalRed>0){hubEvent('map_merge');turn-=totalRed;checkConstellations();if(turn<=0){phase='gameover';gameOverReason=txt('map.go.zero');return;}retractToTurn();redistribute();checkVoidAccess();}
}
function consolidateCaptures(mk,mid){const ks=new Set(mk);const tr=[];const ac=new Set();for(let i=0;i<captureOrder.length;i++){const e=captureOrder[i];if(e.keys.some(k=>ks.has(k))){tr.push(i);for(const k of e.keys)ac.add(k);}}for(const k of mk)ac.add(k);for(let i=tr.length-1;i>=0;i--)captureOrder.splice(tr[i],1);captureOrder.push({keys:[...ac],mergeId:mid});}
function showMergeFlash(t){feed(t);} // (in the feed: nothing is said mid-screen)
function checkVoidAccess(){const vc=cells[K(0,0)];if(!vc||!vc.isVoid){voidOpen=false;return;}const ns=neighbors(0,0);if(!ns.every(([q,r])=>{const c=cells[K(q,r)];return c&&c.cap;})){voidOpen=false;return;}const tri=new Set();for(const[q,r]of ns)for(const g of mergeGroups)if((g.type==='tri'||g.type==='dark3')&&g.cells.includes(K(q,r)))tri.add(g.id);voidOpen=tri.size>=3;}
function newMap(){ // a new map, a descent and every midnight: the source at the centre bursts out (T.mapBurstRings rings at 1.00), the player beside it
  dropSession();cells={};totalCells=0;captureOrder=[];mergeGroups=[];mergeIdCounter=0;voidOpen=false;phase='move';gameOverReason='';prev={};constel=[];weaveSel=[];weaveAsk=null;armed=null;
  cells[K(0,0)]={q:0,r:0,v:0,cap:false,capVal:0,isP:false,locked:false,mergeId:null,isVoid:true};totalCells++;
  turn=Math.max(1,T.mapBurstRings||3);for(let n=1;n<=turn;n++)addRing(n);pool=0;for(const k in cells)if(!cells[k].isVoid){cells[k].v=1.0;pool+=1;}fresh=true;
  const r1=ring(1),si=Math.floor(Math.random()*r1.length);pQ=r1[si][0];pR=r1[si][1];
  if(MP.on&&MP.role==='host'){const h=mpP('h');if(h){h.q=pQ;h.r=pR;}for(const P of MP.players)if(P.id!=='h'){const sp=mpSpot();P.q=sp[0];P.r=sp[1];}} // (playing together: everyone starts the new day beside the source)
  cells[K(pQ,pR)].isP=true;burstFx={t0:performance.now(),kind:'burst'};
}
function descendDepth(){if(!voidOpen)return;depth++;newMap();showTurn();focusCam(false);updateHint();showMergeFlash(txt('map.descended_to_d',depth));hubEvent('map_descend');saveMap();}
function camBounds(keys){ // a set of hexes' extent on the plane, as a rectangle (their corners' furthest points), plus the lake margin round it
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const k of keys){const c=cells[k]||{q:+k.split(',')[0],r:+k.split(',')[1]},[x,y]=a2w(c.q,c.r);x0=Math.min(x0,x-HEX*0.866);x1=Math.max(x1,x+HEX*0.866);y0=Math.min(y0,y-HEX);y1=Math.max(y1,y+HEX);}
  const M=HEX*(T.mapLakeMargin!=null?T.mapLakeMargin:1.1);return x0>x1?null:[x0-M,y0-M,x1+M,y1+M];}
function camView(){const o=(X,Y)=>{const[wx,wy]=s2wp(X,Y);return[wx-camX,wy-camY];};return[o(0,SH/2)[0],o(SW/2,0)[1],o(SW,SH/2)[0],o(SW/2,SH)[1]];} // what the screen's edges show, from the camera (at this zoom)
function camFit(b){const[lx,ty,rx,by]=camView(),z=Math.max(T.mapZoomMin||0.55,Math.min(T.mapZoomMax||1.8,viewZoom*Math.min((rx-lx)/(b[2]-b[0]),(by-ty)/(b[3]-b[1])))),k=viewZoom/z; // the zoom that just fits b, and the camera then (in its middle)
  return{z,x:(b[0]+b[2])/2-(lx+rx)/2*k,y:(b[1]+b[3])/2-(ty+by)/2*k};}
function camZoomTo(z){viewZoom=z;const E=1.3/Math.min(1,z);if(Math.abs(E-_E)>0.12)mapResize();else camUpdate();}
let camTween=null,camTiltOv=null,dive=null,statusCam=null; // statusCam: Status is open (its menu's width w, the zoom z it goes to, and your view to go back to) // dive: going into a surface (dir 1) or coming out of it (−1)
function diveStart(key,dir,done,back){const c=cells[key];if(!c||!cam){if(done)done();return null;}const[wx,wy]=a2w(c.q,c.r),k=proj(...w2s(wx,wy))[2]||1,zFit=viewZoom*Math.min(SW,SH)*0.92/(2*HEX*k); // the zoom where the hex fills the frame
  dive={t0:performance.now(),ms:T.mapEnterMs||1800,x:wx,y:wy,a:back||{x:camX,y:camY,z:viewZoom,t:T.mapTilt!=null?T.mapTilt:32},zFit:back&&back.zFit||zFit,dir,done};dive.a.zFit=dive.zFit;return dive.a;}
function diveStep(){ // over the hex, waiting for the buoy to be under; then turning to look straight down with the hex filling the frame; then down into it (coming out: the same, backwards)
  const D=dive,u=Math.min(1,(performance.now()-D.t0)/D.ms),U=D.dir>0?u:1-u,e=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);},p1=e(U/0.35),p2=e((U-0.4)/0.3),p3=e((U-0.72)/0.28),A=D.a;

function camSees(wx,wy){if(!cam)return false;const[X,Y]=w2sc(wx,wy),m=Math.min(SW,SH)*0.08;return X>m&&X<SW-m&&Y>m&&Y<SH-m;} // a point well inside the screen
function camTweenTo(keys,ms){const b=camBounds(keys);if(!b||SCENE)return;const f=camFit(b);camTween={t0:performance.now(),dur:ms,a:{x:camX,y:camY,z:viewZoom},b:f};}
function camFrame(){ // the camera is held on the spill: at its extent (a rectangle round its hexes, plus the lake margin, room for a bottle or a duck to swim in) it stops dead; a spill smaller than the view sits in its middle
  if(SCENE||!cam||!SW)return;
  if(dive){diveStep();return;}
  if(statusCam){const C=statusCam;if(Math.abs(C.z-viewZoom)>1e-3)camZoomTo(viewZoom+(C.z-viewZoom)*0.08);const[wx,wy]=s2wp(Math.max(80,(SW-C.w)/2),SH*0.55);camTX=camX+(buoy.x-wx);camTY=camY+(buoy.y-wy);return;} /* (no edge: it is framing the buoy) */
  if(camTween){const t=Math.min(1,(performance.now()-camTween.t0)/camTween.dur),e=t*t*(3-2*t),A=camTween.a,B=camTween.b;camX=camTX=A.x+(B.x-A.x)*e;camY=camTY=A.y+(B.y-A.y)*e;camZoomTo(A.z+(B.z-A.z)*e);if(t>=1){camTween=null;mapResize();}return;}
  const b=camBounds(Object.keys(cells));if(!b)return;const f=camFit(b);zoomFloor=f.z;
  if(zoomAuto||viewZoom<f.z-1e-3){const d=f.z-viewZoom;if(Math.abs(d)>2e-3){camZoomTo(viewZoom+(Math.abs(d)<0.01?d:d*0.12));_zoomSettle=1;}else if(_zoomSettle){_zoomSettle=0;mapResize();}} // its zoom follows the spill (at most out to it; held there until you zoom in)
  const[lx,ty,rx,by]=camView(),cx=v=>b[2]-b[0]<=rx-lx?(b[0]+b[2])/2-(lx+rx)/2:Math.max(b[0]-lx,Math.min(b[2]-rx,v)),cy=v=>b[3]-b[1]<=by-ty?(b[1]+b[3])/2-(ty+by)/2:Math.max(b[1]-ty,Math.min(b[3]-by,v));
  camTX=cx(camTX);camTY=cy(camTY);camX=cx(camX);camY=cy(camY);} // (a hard edge: the camera itself, not only where it is heading)

function focusCam(a,move){if(_mpFor)return; // (a friend's move: the host's view stays)
  const[wx,wy]=a2w(pQ,pR);if(move&&camSees(wx,wy)){buoy.follow=false;return;} /* a move to a hex you can see: the camera stays where you put it */

    at(2600,()=>{recomputeLocked();let n=0;for(const k in cells){const c=cells[k];if(!c.cap&&!c.isVoid&&!c.locked)n++;}let ex=0;for(const k in cells){const c=cells[k];if(c.cap)ex+=c.capVal;else if(c.locked)ex+=c.v;}pool=ex+n*0.009;fresh=true;advanceTurn();camTX=camTY=0;});return 7000;}, // the value runs too thin (below 0.01): the oldest capture becomes a void // the value runs too thin: the oldest capture becomes a void
  descend(){sceneReset();ring(1).forEach(([q,r],i)=>at(300+i*350,()=>sceneCap(K(q,r),'bright')));at(2700,()=>{voidOpen=true;});at(3600,()=>{const o=cells[K(pQ,pR)];if(o)o.isP=false;depth++;newMap();camTX=camTY=0;showMergeFlash(txt('map.descended_to_d',depth));});return 6500;},
  constellation(){sceneReset();const ks=['2,-1','1,1','-1,2','-2,1','-1,-1'];ks.forEach((k,i)=>at(300+i*250,()=>sceneCap(k,'bright')));armed='weave';weaveSel=[];
    ks.forEach((k,i)=>at(1800+i*450,()=>weaveSel.push(k)));at(1800+5*450+300,()=>{constel=[{keys:ks.slice(),type:'lens'}];weaveSel=[];armed=null;showMergeFlash(txt('map.constellation_lens'));});at(5200,()=>{advanceTurn();showMergeFlash(txt('map.1_lens'));});return 7500;},
  ring(){return sceneRing(()=>'bright');},
  brightstar(){return sceneRing(()=>'bright');},
  darkstar(){return sceneRing(()=>'dark');},
  shops(){sceneReset(4);clock=6;viewZoom=1.7;const k=ring(1).map(([q,r])=>K(q,r)).filter(k=>!cells[k].isP),t=[[700,()=>clock=9],[1400,()=>{sceneCap(k[0],'bright');cells[k[0]].shop={id:'bright',rank:1};}],[2600,()=>{clock=12;sceneCap(k[2],'bright');cells[k[2]].shop={id:'duck',rank:2};}],
    [3800,()=>{hubPop[0]={id:'magnetic',rank:2};}],[5000,()=>{clock=18;sceneCap(k[4],'bright');cells[k[4]].shop={id:'bright',rank:3};delete cells[k[0]].shop;}],[6400,()=>clock=21]];for(const[ms,f]of t)at(ms,f);return 8400;},
  end(){sceneReset();const r1=ring(1).map(([q,r])=>K(q,r));r1.forEach((k,i)=>at(400+i*300,()=>i<r1.length-1?sceneCap(k,'bright'):completeCaptureForCell(k,'bright')));return 7000;}};
function sceneDucks(n){const ids=Object.keys(DUCK_TYPES).slice(0,n);duckLog={};for(const k of ids)duckLog[k]=ids.length>1?1:n;T.mapDucks=n;pond=[];at(300,()=>{water.at=0;scanWater(performance.now());for(let i=0;i<n;i++)spawnLakeDuck(performance.now(),false,true);});} // (a demo's lake: a few of the kinds)
function sceneRing(kind){sceneReset(4);const r3=ring(3).map(([q,r])=>K(q,r));r3.forEach((k,i)=>at(300+i*140,()=>{if(i<r3.length-1)sceneCap(k,kind(i));else{completeCaptureForCell(k,kind(i));if(clearFx[k])clearFx[k].t0=performance.now();}}));return 300+r3.length*140+4200;}
function sceneLoop(){const f=SCENES[SCENE]||SCENES.map;const ms=f();setTimeout(sceneLoop,ms);}

if(SCENE){document.body.classList.add('scene');if(SCENE==='shops'||SCENE==='street')document.body.classList.add('scene-shops');if(SCENE==='fortune')document.body.classList.add('scene-calm');try{const u=new URLSearchParams(location.search);T=JSON.parse(u.get('T')||'{}');DUCK_TYPES=JSON.parse(u.get('D')||'{}');}catch(e){T={};}HEX=T.mapHexSize||HEX;viewZoom=1.3;mapResize();camUpdate&&SW&&camUpdate();sceneLoop();startMapLoop();}
else{nebEl.src='chromatic_nebula.html?hub=1&v='+CACHE_V;if(MPJOIN){newMap();mapResize();netJoin();}else if(!loadMap())initGame();startMapLoop();neb({cmd:'state'});} // (joining a friend: their map comes in its place)
