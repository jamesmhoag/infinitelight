#menu .row{display:flex;gap:6px;align-items:center}#menu .row>span{flex:0 0 150px;font-size:12px;opacity:.8}#menu .row b{flex:0 0 40px;font-weight:400;font-size:11px;text-align:right}

<div id="map-view">

</div></div>

<script>
// ╔══════════════════════════════════════════════════════════════════════════════╗
// ║  MAP ENGINE                                                                 ║
// ╚══════════════════════════════════════════════════════════════════════════════╝
const mc=document.getElementById('mc'),mctx=mc.getContext('2d');
let MW,MH;
let HEX=34; // T.mapHexSize (tuned in the Esc menu / the surface's Tune menu)
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
let camX=0,camY=0,camTX=0,camTY=0;
let cells={},turn=0,score=0,pQ=0,pR=0,totalCells=0;
let phase='move',turnTimer=0,mergeTimer=0;
let gameOverReason='';
const POOL=6.0,MIN_VAL=0.01;
let hQ=null,hR=null;
let captureOrder=[],mergeGroups=[],mergeIdCounter=0;
let depth=0,voidOpen=false;
let currentView='map'; // 'map' | 'level' (a surface is open) | 'overlay' (the Guide or an event card)
let nebulaCellKey=null; // the hex whose unfinished surface is saved (one at a time)
let mapRafId=null;
// Shared with the surface: its tuners, the inventory and the discoveries (the surface owns and saves them)
let T={},inv={dim:0},disc=new Set(),tuneDefs=[],nebReady=false;
const MAP_KEY='il_map_v1';

const K=(q,r)=>q+','+r;
const parseK=k=>{const p=k.split(',');return[+p[0],+p[1]];};
const a2w=(q,r)=>[HEX*(Math.sqrt(3)*q+Math.sqrt(3)/2*r),HEX*(3/2*r)];
const w2s=(wx,wy)=>[wx-camX+MW/2,wy-camY+MH/2];
const s2w=(sx,sy)=>[sx+camX-MW/2,sy+camY-MH/2];
function p2a(sx,sy){const[wx,wy]=s2w(sx,sy);const q=(Math.sqrt(3)/3*wx-1/3*wy)/HEX,r=(2/3*wy)/HEX;const s=-q-r;let rq=Math.round(q),rr=Math.round(r),rs=Math.round(s);const dq=Math.abs(rq-q),dr=Math.abs(rr-r),ds=Math.abs(rs-s);if(dq>dr&&dq>ds)rq=-rr-rs;else if(dr>ds)rr=-rq-rs;return[rq,rr];}
function dist(q1,r1,q2,r2){return(Math.abs(q1-q2)+Math.abs(q1+r1-q2-r2)+Math.abs(r1-r2))/2}
function cellRing(q,r){return Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r));}
function ring(n){if(!n)return[[0,0]];const res=[];let q=n,r=0;for(let d=0;d<6;d++)for(let i=0;i<n;i++){res.push([q,r]);q+=DIRS[(d+2)%6][0];r+=DIRS[(d+2)%6][1];}return res;}
function neighbors(q,r){return DIRS.map(([dq,dr])=>[q+dq,r+dr]);}
function adjCaptured(q,r){for(const[nq,nr]of neighbors(q,r)){const c=cells[K(nq,nr)];if(c&&c.cap)return true;}return false;}

function retractToTurn(){
  const maxRing=turn;const toRemove=[];
  for(const k in cells){const c=cells[k];if(c.isVoid||cellRing(c.q,c.r)<=maxRing||c.cap||c.isP)continue;toRemove.push(k);}
  const actual=toRemove.filter(k=>!adjCaptured(cells[k].q,cells[k].r));
  for(const k of actual){delete cells[k];totalCells--;}
  recomputeLocked();
}
function addRing(n){for(const[q,r]of ring(n)){const k=K(q,r);if(!cells[k]){cells[k]={q,r,v:0,cap:false,capVal:0,isP:false,locked:false,mergeId:null,isVoid:false};totalCells++;}}}
function recomputeLocked(){for(const k in cells){const c=cells[k];c.locked=(!c.cap&&!c.isVoid&&adjCaptured(c.q,c.r));}}
function dropSession(){ // the unfinished surface is thrown away (values changed, or a new map)
  if(!nebulaCellKey)return;const c=cells[nebulaCellKey];if(c){delete c.shot;delete c._im;}nebulaCellKey=null;neb({cmd:'drop'});
}
function redistribute(){
  recomputeLocked();let exSum=0,exN=0,voidN=0;
  for(const k in cells){const c=cells[k];if(c.isVoid){voidN++;continue;}if(c.cap){exSum+=c.capVal;exN++;}else if(c.locked){exSum+=c.v;exN++;}}
  const freeN=totalCells-exN-voidN;if(freeN<=0)return;
  const pv=(POOL-exSum)/freeN;
  for(const k in cells){const c=cells[k];if(c.isVoid||c.cap||c.locked)continue;c.v=Math.round(Math.max(0,pv)*10000)/10000;}
  dropSession(); // moving resets an unfinished surface
}
function decayCycle(){
  let mx=200;
  while(mx-->0){
    let fv=null;for(const k in cells){const c=cells[k];if(!c.cap&&!c.isVoid&&!c.locked){fv=c.v;break;}}
    if(fv===null||fv>=MIN_VAL)break;
    if(captureOrder.length===0){phase='gameover';gameOverReason='all captures dissipated';return;}
    const oldest=captureOrder.shift();
    for(const k of oldest.keys){const c=cells[k];if(!c)continue;c.cap=false;c.capVal=0;c.isVoid=true;c.mergeId=null;c.v=0;delete c.kind;}
    if(oldest.mergeId!=null)mergeGroups=mergeGroups.filter(g=>g.id!==oldest.mergeId);
    hubEvent('map_decay');
    redistribute();
  }
  checkVoidAccess();
}
function detectMerges(){
  let totalRed=0;
  for(const k in cells){const c=cells[k];if(!c.cap||c.isVoid)continue;const ns=neighbors(c.q,c.r);const nKeys=ns.map(([q,r])=>K(q,r));if(!nKeys.every(nk=>{const nc=cells[nk];return nc&&nc.cap&&!nc.isVoid;}))continue;const allKeys=[k,...nKeys];if(allKeys.some(ak=>{const ac=cells[ak];return ac&&ac.mergeId!=null;}))continue;const gid=mergeIdCounter++;mergeGroups.push({id:gid,type:'hex',cells:[...allKeys]});for(const ak of allKeys)if(cells[ak])cells[ak].mergeId=gid;consolidateCaptures(allKeys,gid);totalRed+=3;showMergeFlash('⬡ Hex Merge · Rings −3');}
  const capKeys=Object.keys(cells).filter(k=>{const c=cells[k];return c.cap&&!c.isVoid;});
  for(let i=0;i<capKeys.length;i++){const[q1,r1]=parseK(capKeys[i]);const n1=neighbors(q1,r1).map(([q,r])=>K(q,r)).filter(nk=>capKeys.includes(nk));for(let j=0;j<n1.length;j++){const[q2,r2]=parseK(n1[j]);for(let jj=j+1;jj<n1.length;jj++){const[q3,r3]=parseK(n1[jj]);if(dist(q2,r2,q3,r3)!==1)continue;const triKeys=[capKeys[i],n1[j],n1[jj]].sort();if(triKeys.some(tk=>{const tc=cells[tk];return tc&&tc.mergeId!=null;}))continue;const gid=mergeIdCounter++;mergeGroups.push({id:gid,type:'tri',cells:[...triKeys]});for(const tk of triKeys)if(cells[tk])cells[tk].mergeId=gid;consolidateCaptures(triKeys,gid);totalRed+=1;showMergeFlash('△ Merge · Rings −1');}}}
  if(totalRed>0){hubEvent('map_merge');turn-=totalRed;if(turn<=0){phase='gameover';gameOverReason='turn reduced to zero';return;}retractToTurn();redistribute();checkVoidAccess();}
}
function consolidateCaptures(mk,mid){const ks=new Set(mk);const tr=[];const ac=new Set();for(let i=0;i<captureOrder.length;i++){const e=captureOrder[i];if(e.keys.some(k=>ks.has(k))){tr.push(i);for(const k of e.keys)ac.add(k);}}for(const k of mk)ac.add(k);for(let i=tr.length-1;i>=0;i--)captureOrder.splice(tr[i],1);captureOrder.push({keys:[...ac],mergeId:mid});}
function showMergeFlash(t){const el=document.getElementById('merge-flash');el.textContent=t;el.classList.add('show');clearTimeout(mergeTimer);mergeTimer=setTimeout(()=>el.classList.remove('show'),1500);}
function checkVoidAccess(){const vc=cells[K(0,0)];if(!vc||!vc.isVoid){voidOpen=false;return;}const ns=neighbors(0,0);if(!ns.every(([q,r])=>{const c=cells[K(q,r)];return c&&c.cap;})){voidOpen=false;return;}const tri=new Set();for(const[q,r]of ns)for(const g of mergeGroups)if(g.type==='tri'&&g.cells.includes(K(q,r)))tri.add(g.id);voidOpen=tri.size>=3;}
function newMap(){ // shared by a new map and a descent: one ring around the centre void, the player on a random hex of it
  dropSession();cells={};turn=1;totalCells=0;captureOrder=[];mergeGroups=[];mergeIdCounter=0;voidOpen=false;phase='move';gameOverReason='';prev={};
  cells[K(0,0)]={q:0,r:0,v:0,cap:false,capVal:0,isP:false,locked:false,mergeId:null,isVoid:true};totalCells++;
  addRing(1);for(const k in cells)if(!cells[k].isVoid)cells[k].v=1.0;
  const r1=ring(1),si=Math.floor(Math.random()*r1.length);pQ=r1[si][0];pR=r1[si][1];
  cells[K(pQ,pR)].isP=true;
}
function descendDepth(){if(!voidOpen)return;depth++;newMap();showTurn();focusCam(false);updateHint();showMergeFlash(`Descended to D${depth}`);hubEvent('map_descend');saveMap();}
function focusCam(a){const[wx,wy]=a2w(pQ,pR);camTX=wx;camTY=wy;if(!a){camX=camTX;camY=camTY;}}
function initGame(){ // a new map: score and depth start over; items, resources and discoveries live in the surface's save and are kept
  score=0;depth=0;newMap();
  showTurn();mapResize();focusCam(false);updateHint();saveMap();
}
function advanceTurn(){turn++;addRing(turn);redistribute();decayCycle();showTurn();}
function showTurn(){const el=document.getElementById('turn-label');el.textContent='Turn '+turn;el.classList.add('show');clearTimeout(turnTimer);turnTimer=setTimeout(()=>el.classList.remove('show'),1200);}

function getMoves(){
  const out=[];
  for(const[dq,dr]of DIRS){let q=pQ+dq,r=pR+dr;const c=cells[K(q,r)];if(!c)continue;
    if(c.isVoid){if(voidOpen&&q===0&&r===0)out.push({q,r,path:[]});continue;}
    if(!c.cap){out.push({q,r,path:[]});continue;}
    const path=[{q,r}];q+=dq;r+=dr;
    while(true){const c2=cells[K(q,r)];if(!c2)break;if(c2.isVoid){if(voidOpen&&q===0&&r===0)out.push({q,r,path:[...path]});if(!(q===0&&r===0)){path.push({q,r});q+=dq;r+=dr;continue;}break;}if(!c2.cap){out.push({q,r,path:[...path]});break;}path.push({q,r});q+=dq;r+=dr;}}
  return out;
}
function doCapture(){ // enter the surface of the hex you stand on
  if(phase==='gameover'||!nebReady)return;
  const c=cells[K(pQ,pR)];
  if(!c||c.cap||c.isVoid)return;
  if(c.v<=0){showMergeFlash('no value — cannot capture');return;}
  enterNebula(K(pQ,pR));
}
function completeCaptureForCell(cellKey,kind){
  const c=cells[cellKey];if(!c||c.cap)return;
  c.cap=true;c.capVal=c.v;c.kind=kind;delete c.shot;delete c._im;
  score=Math.round((score+c.v)*100)/100;
  captureOrder.push({keys:[cellKey],mergeId:null});
  phase='captured';
  recomputeLocked();
  nebulaCellKey=null;
  detectMerges();
  updateHint();hubEvent('map_clear');saveMap();
}
function doMove(tq,tr){
  if(phase==='gameover')return;
  const tc=cells[K(tq,tr)];
  if(tc&&tc.isVoid&&voidOpen&&tq===0&&tr===0){const ok=cells[K(pQ,pR)];if(ok)ok.isP=false;descendDepth();return;}
  const ok=cells[K(pQ,pR)];if(ok)ok.isP=false;
  pQ=tq;pR=tr;tc.isP=true;focusCam(true);
  advanceTurn();if(phase!=='gameover')phase='move';
  if(phase==='move'&&!getMoves().length){phase='gameover';gameOverReason='no viable moves';}
  updateHint();saveMap();
}
function updateHint(){
  const el=document.getElementById('capture-hint');const c=cells[K(pQ,pR)];
  if(phase==='gameover'){el.textContent='game over: '+gameOverReason+' · a new map keeps your items';el.classList.add('show');}
  else if(phase==='captured'){el.textContent='captured! move to end turn';el.classList.add('show');}
  else if(c&&!c.cap&&!c.isVoid&&phase==='move'){
    if(c.v<=0){el.textContent='no value — cannot capture';el.classList.add('show');}
    else{el.textContent=`Space / click to ${nebulaCellKey===K(pQ,pR)?'continue this surface':'enter this surface'} (${c.v.toFixed(2)}) · or move`;el.classList.add('show');}
  } else el.classList.remove('show');
}
function mapResize(){MW=innerWidth;MH=innerHeight;mc.width=MW;mc.height=MH;}
function hexPath(cx,cy,s){mctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6;if(!i)mctx.moveTo(cx+s*Math.cos(a),cy+s*Math.sin(a));else mctx.lineTo(cx+s*Math.cos(a),cy+s*Math.sin(a));}mctx.closePath();}
function starPath(cx,cy,or,ir,pts){mctx.beginPath();for(let i=0;i<pts*2;i++){const a=Math.PI/pts*i-Math.PI/2,r=i%2?ir:or;if(!i)mctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a));else mctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}mctx.closePath();}

// ╔══════════════════════════════════════════════════════════════════════════════╗
// ║  HEX SURFACE LAYER — each uncleared hex shows its surface, drawn by the     ║
// ║  surface's own renderer (pixel map, blur passes, α: the same as in play)    ║
// ╚══════════════════════════════════════════════════════════════════════════════╝
// The surface builds each hex's level while idle, renders one frame and sends back a snapshot (mapZoom crops it).
// An unfinished surface shows the snapshot taken when it was left.
let prev={},prevPending=new Set(),mapNeed=[],renderSig='';
const shotSize=()=>Math.round(2*HEX*(window.devicePixelRatio||1));
function cellSeed(c){return Math.abs(Math.sin(c.q*127.1+c.r*311.7+depth*999)*43758.5453)%100;}
function cellCov(c){const lo=T.mapCovMin!=null?T.mapCovMin:0.25,full=T.mapCovFull||1;return Math.round((lo+(1-lo)*Math.min(1,c.v/full))*1000)/1000;}
function syncRenderSig(){ // any tuner that changes how a surface looks (not sound, discoveries or the map's own layout) re-shoots the hexes
  let h=0;const str=JSON.stringify(Object.keys(T).filter(k=>!/^(dc_|soundOn|masterVol|mapAlpha|mapCov|mapClear|mapHexSize|duck)/.test(k)).sort().map(k=>T[k]))+'|'+shotSize();
  for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))|0;renderSig=''+h;
}
function cellSig(c){return cellSeed(c).toFixed(6)+'|'+cellCov(c)+'|'+renderSig;}
function requestPreviews(keys){
  if(!nebReady||!keys.length)return;
  const items=[];for(const k of keys){if(prevPending.has(k))continue;const c=cells[k];prevPending.add(k);items.push({key:k,sig:cellSig(c),seed:cellSeed(c),cov:cellCov(c)});}
  if(items.length)neb({cmd:'preview',items,size:shotSize()});
}
function shotImg(o,url){if(!o._im||o._im._u!==url){o._im=new Image();o._im._u=url;o._im.src=url;}return o._im.complete&&o._im.naturalWidth?o._im:null;}
function cellLayer(k,c){
  if(c.shot)return shotImg(c,c.shot); // an unfinished surface: as it was left
  const p=prev[k];
  if(!p||p.sig!==cellSig(c)){if(!prevPending.has(k))mapNeed.push(k);} // re-shoot; the old picture stays up until the new one arrives
  return p&&p.img?shotImg(p,p.img):null;
}

function mapRender(){
  if(currentView==='level'){mapRafId=null;return;}
  camX+=(camTX-camX)*0.1;camY+=(camTY-camY)*0.1;
  mctx.fillStyle='#050608';mctx.fillRect(0,0,MW,MH);
  mapNeed=[];
  const moves=(phase==='move'||phase==='captured')?getMoves():[];
  const candMap={};for(const m of moves)candMap[K(m.q,m.r)]=m;
  const hoverKey=hQ!==null?K(hQ,hR):null;
  const hoverMove=hoverKey?candMap[hoverKey]:null;
  const ptSet=new Set();if(hoverMove)for(const p of hoverMove.path)ptSet.add(K(p.q,p.r));
  const mergedSet=new Set();for(const g of mergeGroups)for(const ck of g.cells)mergedSet.add(ck);
  const keys=Object.keys(cells);keys.sort((a,b)=>(cells[a].isP?1:0)-(cells[b].isP?1:0));
  const now=performance.now(),brightOnes=[];
  for(const k of keys){
    const c=cells[k];const[sx,sy]=w2s(...a2w(c.q,c.r));
    if(sx<-HEX*2||sx>MW+HEX*2||sy<-HEX*2||sy>MH+HEX*2)continue;
    const s=HEX*0.92,isCand=!!candMap[k],isHov=k===hoverKey&&isCand,isPT=ptSet.has(k),isMerged=mergedSet.has(k),bright=c.cap&&c.kind!=='dark',dark=c.cap&&c.kind==='dark';
    let fill,stroke,sw=1,vA=0.6,vC='255,255,255';
    if(c.isVoid){const isCtr=c.q===0&&c.r===0;if(isCtr&&voidOpen){fill=isHov?'rgba(180,140,255,0.15)':'rgba(120,80,200,0.06)';stroke=isHov?'rgba(180,140,255,0.6)':'rgba(160,120,230,0.35)';sw=isHov?2:1.5;}else{fill='rgba(8,8,12,0.9)';stroke='rgba(255,255,255,0.06)';}vA=0;}
    else if(bright){fill=isPT?'rgba(225,240,255,0.85)':'rgba(255,255,255,0.92)';stroke=isMerged?'rgba(190,160,250,0.9)':c.isP?'rgba(0,220,220,0.9)':'#fff';sw=c.isP?2.5:1.5;vA=0.75;vC='20,24,32';}
    else if(dark){fill='rgba(0,0,0,0.96)';stroke=isMerged?'rgba(190,160,250,0.7)':c.isP?'rgba(0,220,220,0.8)':'rgba(150,130,200,0.5)';sw=c.isP?2.5:1.5;vA=0.55;vC='200,185,240';}
    else if(c.isP){fill='rgba(0,185,185,0.10)';stroke='rgba(0,220,220,0.6)';sw=2;vA=0.9;vC='0,230,230';}
    else if(c.locked){fill=isHov?'rgba(200,165,40,0.14)':'rgba(180,148,35,0.09)';stroke=isHov?'rgba(225,190,55,0.6)':'rgba(210,175,45,0.38)';sw=isHov?1.5:1;vA=0.7;vC='225,190,55';}
    else if(isCand){fill=isHov?'rgba(0,170,170,0.12)':'rgba(18,22,28,0.75)';stroke=isHov?'rgba(0,210,210,0.45)':'rgba(255,255,255,0.14)';sw=isHov?1.5:1;}
    else{fill='rgba(14,17,22,0.75)';stroke='rgba(255,255,255,0.08)';}

    if(c.isP){mctx.save();mctx.shadowColor='rgba(0,210,210,0.2)';mctx.shadowBlur=24;hexPath(sx,sy,s+3);mctx.fillStyle='rgba(0,210,210,0.05)';mctx.fill();mctx.restore();}
    if(c.isVoid&&c.q===0&&c.r===0&&voidOpen){mctx.save();mctx.shadowColor='rgba(160,120,230,0.25)';mctx.shadowBlur=28;hexPath(sx,sy,s+2);mctx.fillStyle='rgba(160,120,230,0.04)';mctx.fill();mctx.restore();}
    hexPath(sx,sy,s);mctx.fillStyle=fill;mctx.fill();
    if(!c.cap&&!c.isVoid){const img=cellLayer(k,c);if(img){mctx.save();hexPath(sx,sy,s);mctx.clip();mctx.globalAlpha=T.mapAlpha!=null?T.mapAlpha:1;mctx.drawImage(img,sx-HEX,sy-HEX,2*HEX,2*HEX);mctx.restore();}}
    if(dark){ // the dark remnant left on the hex
      const rr=HEX*0.36,pul=0.5+0.5*Math.sin(now/700+c.q*1.7+c.r);
      mctx.save();mctx.shadowColor='rgba(170,140,255,0.7)';mctx.shadowBlur=10+8*pul;mctx.beginPath();mctx.arc(sx,sy,rr,0,Math.PI*2);mctx.fillStyle='#000';mctx.fill();
      mctx.strokeStyle=`rgba(190,165,255,${0.45+0.3*pul})`;mctx.lineWidth=1.5;mctx.stroke();mctx.restore();
    }
    hexPath(sx,sy,s);mctx.strokeStyle=stroke;mctx.lineWidth=sw;mctx.stroke();
    if(c.locked){const d=3.5;mctx.beginPath();mctx.moveTo(sx,sy-HEX*0.28-d);mctx.lineTo(sx+d,sy-HEX*0.28);mctx.lineTo(sx,sy-HEX*0.28+d);mctx.lineTo(sx-d,sy-HEX*0.28);mctx.closePath();mctx.fillStyle='rgba(220,185,50,0.6)';mctx.fill();}
    if(k===nebulaCellKey){mctx.font=`${Math.max(8,HEX*0.24)}px 'Share Tech Mono',monospace`;mctx.textAlign='center';mctx.textBaseline='middle';mctx.fillStyle='rgba(0,230,230,0.85)';mctx.fillText('❚❚ saved',sx,sy-HEX*0.5);}
    if(c.isVoid){if(c.q===0&&c.r===0&&voidOpen){mctx.font=`${HEX*0.45}px 'Orbitron',sans-serif`;mctx.textAlign='center';mctx.textBaseline='middle';mctx.fillStyle='rgba(180,140,255,0.5)';mctx.fillText('▽',sx,sy+1);}else if(c.q===0&&c.r===0){mctx.beginPath();mctx.arc(sx,sy,3,0,Math.PI*2);mctx.fillStyle='rgba(255,255,255,0.06)';mctx.fill();}else{const m=4;mctx.strokeStyle='rgba(255,255,255,0.08)';mctx.lineWidth=1;mctx.beginPath();mctx.moveTo(sx-m,sy-m);mctx.lineTo(sx+m,sy+m);mctx.stroke();mctx.beginPath();mctx.moveTo(sx+m,sy-m);mctx.lineTo(sx-m,sy+m);mctx.stroke();}}
    if(bright){brightOnes.push([sx,sy,c.capVal,stroke,sw]);continue;} // drawn after the bleed below
    if(!c.isVoid){const dv=c.cap?c.capVal:c.v;mctx.font=`${Math.max(10,HEX*0.34)}px 'Share Tech Mono',monospace`;mctx.textAlign='center';mctx.textBaseline='middle';
      mctx.save();if(!c.cap){mctx.shadowColor='#000';mctx.shadowBlur=4;}
      mctx.fillStyle=`rgba(${vC},${vA})`;mctx.fillText(dv.toFixed(2),sx,sy+(dark?HEX*0.55:c.locked?2:0));mctx.restore();}
  }
  // Bright clears bleed into their neighbours: every bright hex together, blurred and screened over the map, then their outline and value on top
  if(brightOnes.length){const bl=T.mapClearBlur!=null?T.mapClearBlur:0.6,ba=T.mapClearBleed!=null?T.mapClearBleed:0.85;
    if(bl>0&&ba>0)for(const[k,al,sz]of [[1,ba,1.12],[0.4,ba*0.8,1]]){mctx.save();mctx.filter=`blur(${HEX*bl*k}px)`;mctx.globalCompositeOperation='screen';mctx.fillStyle=`rgba(255,255,255,${al})`;mctx.beginPath(); // a wide and a mid blur pass
      for(const[x,y]of brightOnes)for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6,r=HEX*sz;if(!i)mctx.moveTo(x+r*Math.cos(a),y+r*Math.sin(a));else mctx.lineTo(x+r*Math.cos(a),y+r*Math.sin(a));}
      mctx.fill();mctx.restore();}
    for(const[x,y,v,st,sw]of brightOnes){mctx.save();mctx.filter=`blur(${HEX*0.12}px)`;hexPath(x,y,HEX*0.8);mctx.fillStyle='rgba(255,255,255,0.95)';mctx.fill();mctx.restore();if(st!=='#fff'){hexPath(x,y,HEX*0.92);mctx.strokeStyle=st;mctx.lineWidth=sw;mctx.stroke();} // a soft white core (no hard edge); only the player / merge outline stays crisp
      mctx.font=`${Math.max(10,HEX*0.34)}px 'Share Tech Mono',monospace`;mctx.textAlign='center';mctx.textBaseline='middle';mctx.fillStyle='rgba(20,24,32,0.75)';mctx.fillText(v.toFixed(2),x,y);}}
  // Merge visuals
  for(const g of mergeGroups){if(!g.cells.length)continue;const pts=g.cells.map(ck=>{const cc=cells[ck];return cc?w2s(...a2w(cc.q,cc.r)):null;}).filter(Boolean);if(pts.length<2)continue;mctx.strokeStyle='rgba(160,120,230,0.5)';mctx.lineWidth=1.2;for(let i=0;i<g.cells.length;i++)for(let j=i+1;j<g.cells.length;j++){const c1=cells[g.cells[i]],c2=cells[g.cells[j]];if(c1&&c2&&dist(c1.q,c1.r,c2.q,c2.r)===1){const[x1,y1]=w2s(...a2w(c1.q,c1.r));const[x2,y2]=w2s(...a2w(c2.q,c2.r));mctx.beginPath();mctx.moveTo(x1,y1);mctx.lineTo(x2,y2);mctx.stroke();}}const cx2=pts.reduce((s,p)=>s+p[0],0)/pts.length;const cy2=pts.reduce((s,p)=>s+p[1],0)/pts.length;const sr=g.type==='hex'?HEX*1.6:HEX*0.85;starPath(cx2,cy2,sr,sr*0.42,5);mctx.strokeStyle='rgba(160,120,230,0.55)';mctx.lineWidth=1.5;mctx.stroke();}
  // Direction line
  if(hoverMove&&phase!=='gameover'){const pts=[{q:pQ,r:pR},...hoverMove.path,{q:hoverMove.q,r:hoverMove.r}];mctx.beginPath();for(let i=0;i<pts.length;i++){const[sx,sy]=w2s(...a2w(pts[i].q,pts[i].r));if(!i)mctx.moveTo(sx,sy);else mctx.lineTo(sx,sy);}mctx.strokeStyle='rgba(0,210,210,0.6)';mctx.lineWidth=1.5;mctx.setLineDash([5,4]);mctx.stroke();mctx.setLineDash([]);const[dx,dy]=w2s(...a2w(hoverMove.q,hoverMove.r));mctx.beginPath();mctx.arc(dx,dy,3.5,0,Math.PI*2);mctx.fillStyle='rgba(0,220,220,0.7)';mctx.fill();}
  requestPreviews(mapNeed);
  // HUD
  let dc=0;for(const k in cells)if(!cells[k].isVoid)dc++;
  document.getElementById('cell-count').innerHTML=dc+'<small>cells</small>';
  document.getElementById('depth-display').textContent=`D${depth}`;
  let st=`turn ${turn} · rings ${turn} · score ${score.toFixed(2)} · captures ${captureOrder.length}`;
  if(phase==='gameover')st+=' · game over: '+gameOverReason;
  document.getElementById('score-display').textContent=st;
  discTick();
  mapRafId=requestAnimationFrame(mapRender);
}
function startMapLoop(){if(!mapRafId)mapRafId=requestAnimationFrame(mapRender);}

mc.addEventListener('mousemove',e=>{if(currentView==='map')[hQ,hR]=p2a(e.clientX,e.clientY);});
mc.addEventListener('click',e=>{
  if(currentView!=='map'||phase==='gameover')return;
  const[q,r]=p2a(e.clientX,e.clientY);
  if(q===pQ&&r===pR){doCapture();return;}
  const moves=getMoves();if(moves.find(m=>m.q===q&&m.r===r))doMove(q,r);
});
mc.addEventListener('mouseleave',()=>{hQ=null;hR=null;});
document.addEventListener('keydown',e=>{
  if(e.code==='Escape'){e.preventDefault();if(currentView==='map')toggleMenu();return;}
  if(menuOpen)return;
  if(e.code==='Space'){e.preventDefault();if(currentView==='map')doCapture();}
});
window.addEventListener('resize',mapResize);

// ╔══════════════════════════════════════════════════════════════════════════════╗
// ║  SAVE — the map is kept between sessions (items and discoveries are the     ║
// ║  surface's own save, so a new map never touches them)                       ║
// ╚══════════════════════════════════════════════════════════════════════════════╝
function saveMap(){
  const out={};for(const k in cells){const c=Object.assign({},cells[k]);delete c._im;out[k]=c;}
  try{localStorage.setItem(MAP_KEY,JSON.stringify({v:1,cells:out,turn,score,pQ,pR,totalCells,phase,depth,gameOverReason,captureOrder,mergeGroups,mergeIdCounter,voidOpen,session:nebulaCellKey}));}catch(e){}
}
function loadMap(){
  let d=null;try{d=JSON.parse(localStorage.getItem(MAP_KEY)||'null');}catch(e){}
  if(!d||!d.cells)return false;
  ({cells,turn,score,pQ,pR,totalCells,phase,depth,gameOverReason,captureOrder,mergeGroups,mergeIdCounter,voidOpen}=d);nebulaCellKey=d.session||null;
  mapResize();focusCam(false);updateHint();return true;
}

// ╔══════════════════════════════════════════════════════════════════════════════╗
// ║  THE SURFACE — chromatic_nebula.html in the iframe                          ║
// ╚══════════════════════════════════════════════════════════════════════════════╝
const nebEl=document.getElementById('neb');
function neb(m){if(nebEl.contentWindow)nebEl.contentWindow.postMessage(m,'*');}
function showNeb(on){nebEl.classList.toggle('show',on);if(on){nebEl.focus();try{nebEl.contentWindow.focus();}catch(e){}}else window.focus();}
function enterNebula(cellKey){
  const c=cells[cellKey];
  currentView='level';showNeb(true);
  const resume=nebulaCellKey===cellKey;nebulaCellKey=cellKey;saveMap();
  neb({cmd:'level',key:cellKey,seed:cellSeed(c),cov:cellCov(c),label:`(${c.q},${c.r}) · value ${c.v.toFixed(2)}`,resume});
}
function exitNebula(){currentView='map';showNeb(false);mapResize();startMapLoop();updateHint();evPump();}
let evQ=[];
function hubEvent(id){if(disc.has('ev:'+id)||evQ.includes(id))return;evQ.push(id);evPump();}
function evPump(){if(currentView!=='map'||menuOpen||!nebReady||!evQ.length)return;const id=evQ.shift();if(disc.has('ev:'+id)){evPump();return;}currentView='overlay';showNeb(true);neb({cmd:'event',id});}
function openGuide(){if(!nebReady||currentView!=='map')return;currentView='overlay';showNeb(true);neb({cmd:'guide'});}
function takeState(m){
  if(m.T)T=m.T;if(m.inv)inv=m.inv;if(m.disc)disc=new Set(m.disc);if(m.defs&&m.defs.length)tuneDefs=m.defs;
  if(T.mapHexSize&&T.mapHexSize!==HEX){HEX=T.mapHexSize;focusCam(false);}
  if(m.T)syncRenderSig();applyDisc();syncMenu();
}
window.addEventListener('message',e=>{
  const m=e.data;if(e.source!==nebEl.contentWindow||!m||!m.il)return;
  if(m.T||m.disc)takeState(m);
  if(!nebReady&&m.T){ // the first word from the surface ('ready', or its answer to the 'state' asked for at start — whichever page loaded first)
    nebReady=true;buildTune();
    if(/[?&]resume=1/.test(location.search)){history.replaceState(null,'',location.pathname);const c=nebulaCellKey&&cells[nebulaCellKey];if(c&&!c.cap&&c.q===pQ&&c.r===pR){enterNebula(nebulaCellKey);return;}}
    hubEvent('map');
  }
  if(m.type==='ready'||m.type==='state');
  else if(m.type==='preview'){prevPending.delete(m.key);if(cells[m.key]&&m.img)prev[m.key]={sig:m.sig,img:m.img};}
  else if(m.type==='overlayDone'){if(currentView==='overlay'){currentView='map';showNeb(false);evPump();}}
  else if(m.type==='cleared')completeCaptureForCell(m.key,m.kind); // the hex is captured right away; the player returns with a right-click
  else if(m.type==='return')exitNebula();
  else if(m.type==='quit'){
    const c=cells[m.key];
    if(c&&!c.cap&&!m.cleared&&m.img){c.shot=m.img;nebulaCellKey=m.key;}else nebulaCellKey=null;
    saveMap();
    if(m.to==='main'){location.href='TitleSplash.html';return;}
    exitNebula();
  }
});

// ╔══════════════════════════════════════════════════════════════════════════════╗
// ║  ESC MENU — sound, the Guide, the hex-layer tuners, quit to main            ║
// ╚══════════════════════════════════════════════════════════════════════════════╝
let menuOpen=false;
function toggleMenu(){menuOpen=!menuOpen;document.getElementById('menu').classList.toggle('show',menuOpen);syncMenu();if(!menuOpen)evPump();}
const soundOn=()=>!!T.soundOn;
function setSound(on,vol){T.soundOn=on?1:0;if(vol!=null)T.masterVol=+vol;neb({cmd:'sound',on,vol:vol!=null?+vol:null});syncMenu();}
function syncMenu(){
  document.getElementById('mSnd').textContent='Sound: '+(soundOn()?'ON':'OFF');document.getElementById('mVol').value=T.masterVol!=null?T.masterVol:0.7;
  for(const el of document.querySelectorAll('#mTune input')){el.value=T[el.dataset.k];el.nextElementSibling.textContent=+(+T[el.dataset.k]).toFixed(2);}
}
function buildTune(){ // the same tuner definitions as the surface's Tune menu (one source)
  const box=document.getElementById('mTune');box.innerHTML='';
  for(const d of tuneDefs){const r=document.createElement('div');r.className='row';r.title=d.tip||'';
    r.innerHTML=`<span>${d.label}</span><input type="range" min="${d.min}" max="${d.max}" step="${d.step}" data-k="${d.key}"><b></b>`;
    r.querySelector('input').addEventListener('input',e=>{T[d.key]=+e.target.value;neb({cmd:'tune',T:{[d.key]:T[d.key]}});if(d.key==='mapHexSize'){HEX=T.mapHexSize;focusCam(false);}syncRenderSig();syncMenu();});
    box.appendChild(r);}
  syncMenu();
}
function quitMain(){saveMap();location.href='TitleSplash.html';}

// ── Discoveries (the same rule as the surface: hover while holding the Dim cost; nothing is spent) ──
let dcX=-1,dcY=-1,dcMet=null;
document.addEventListener('mousemove',e=>{dcX=e.clientX;dcY=e.clientY;},true);
const discCost=id=>T['dc_'+id]||0;
function applyDisc(){document.querySelectorAll('[data-disc]').forEach(el=>el.classList.toggle('disc-lock',discCost(el.dataset.disc)>0&&!disc.has(el.dataset.disc)));}
for(const ev of ['mousedown','mouseup','click'])document.addEventListener(ev,e=>{if(e.target.closest&&e.target.closest('.disc-lock')){e.stopPropagation();e.preventDefault();}},true);
function discTick(){
  const v=document.getElementById('veil'),t=dcX>=0?document.elementFromPoint(dcX,dcY):null,el=t&&t.closest?t.closest('.disc-lock'):null;
  if(!el){v.style.display='none';dcMet=null;return;}
  const id=el.dataset.disc,cost=discCost(id),r=el.getBoundingClientRect(),met=(inv.dim||0)>=cost;
  Object.assign(v.style,{display:'flex',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
  if(met){if(!dcMet||dcMet.id!==id)dcMet={id,t:performance.now()};v.textContent='✓ '+cost;v.style.color='#9fd';if(performance.now()-dcMet.t>450){dcMet=null;v.style.display='none';disc.add(id);applyDisc();neb({cmd:'discover',id});}}
  else{dcMet=null;v.textContent=cost+' Dim';v.style.color='#666';}
}

// ═══ START ═══
if(!loadMap())initGame();
startMapLoop();neb({cmd:'state'});
</script>
