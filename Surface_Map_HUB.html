<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box}

#hinv .slot:hover{background:rgba(255,255,255,0.12)}#hinv .slot.armed{background:rgba(255,220,120,0.28);border-color:rgba(255,220,120,0.8)}#hinv .slot.empty{opacity:0.4}

body.scene .hbtn,body.scene #shops,body.scene #hdock,body.scene #legend,body.scene #bottom-bar,body.scene #cell-count,body.scene #depth-display,body.scene #capture-hint,body.scene #hcur{display:none!important} /* the map as a 3D scene: the plane (drawn in 2D, then laid in the scene as its ground) and the ducks on it */

#guide-btn{top:16px;left:16px}#menu-btn{top:16px;left:82px}

#hstats{position:absolute;top:96px;right:16px;z-index:10;display:none;font:10px/1.55 'Share Tech Mono',monospace;color:rgba(255,255,255,0.6);text-align:right;white-space:pre;background:rgba(0,0,0,0.45);padding:6px 9px;border-radius:5px}#hstats.show{display:block}
body.ui-hidden .hbtn,body.ui-hidden #hdock,body.ui-hidden #legend,body.ui-hidden #bottom-bar,body.ui-hidden #cell-count,body.ui-hidden #depth-display,body.ui-hidden #turn-label,body.ui-hidden #hstats,body.ui-hidden #mModes,body.ui-hidden #tuneP{display:none!important}
/* shops: upright on the plane (placed through the camera each frame); open ones glow like neon */
#shops{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.shop{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:auto;will-change:transform}.shop canvas{display:block;will-change:opacity} /* each its own layer: moving or flickering one repaints nothing */

.shop.lit canvas{animation:neon0 5s infinite} /* each shop gets its own flicker (one of these, its own pace and start: shopTick) */
@keyframes neon0{0%,45%,51%,100%{opacity:1}48%{opacity:.78}50%{opacity:.97}53%{opacity:.9}} /* opacity, not a filter: the compositor runs it without repainting the shop */
@keyframes neon1{0%,19%,22%,69%,76%,100%{opacity:1}20%{opacity:.86}71%{opacity:.66}72%{opacity:.98}74%{opacity:.84}}
@keyframes neon2{0%,100%{opacity:.9}50%{opacity:1}}
@keyframes neon3{0%,9%,15%,100%{opacity:1}10%{opacity:.74}11%{opacity:.98}12%{opacity:.76}60%{opacity:.94}}
/* a shop's menu: its sign and store over a black card (name left, price right); grey squares turn the page */
#shop{position:fixed;inset:0;z-index:58;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}#shop.show{display:flex}
#shop .sbox{display:flex;flex-direction:column;align-items:center}

#shop h2{font:700 19px/1.25 system-ui,'Inter',sans-serif;letter-spacing:1.6px;text-align:center;margin:0 0 6px}
#shop .stag{text-align:center;margin-bottom:22px;font-size:12px}
#shop .sarr{position:absolute;top:64px;width:22px;height:22px;background:#d9d9d9;cursor:pointer}#shop .sarr.l{left:-1px}#shop .sarr.r{right:-1px}#shop .sarr.off{opacity:.18;cursor:default}
#shop .srow{display:flex;justify-content:space-between;gap:10px;cursor:pointer;padding:0 2px}#shop .srow:hover{background:rgba(255,255,255,.12)}

#shop .srow.poor{opacity:.38}#shop .srow.own{opacity:.5;cursor:default}#shop .srow.c{justify-content:center;text-align:center;margin:10px 0}
#shop .sfoot{margin-top:16px;min-height:30px;font-size:10px;line-height:1.4;opacity:.6;text-align:center}
</style>

<div id="map-view">

    <span class="ld" style="background:rgba(0,210,210,0.7)"></span>you<br>
    <span class="ld" style="background:rgba(255,255,255,0.9)"></span>cleared (bright)<br>
    <span class="ld" style="background:#000;border-color:rgba(190,160,250,0.8)"></span>cleared (dark remnant)<br>
    <span class="ld" style="background:rgba(210,175,50,0.2);border-color:rgba(210,175,50,0.5)"></span>locked<br>
    <span class="ld" style="background:rgba(180,140,255,0.25);border-color:rgba(180,140,255,0.6)"></span>merged<br>
    <span class="ld" style="background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.1)"></span>void
  </div>
</div>

  <div class="gl">Leave</div><button onclick="quitMain()">Quit to main menu</button>
</div></div>
<div id="day-report"><div class="gm"><h2></h2><div class="dsum"></div><div class="gl">Days</div><div class="dlogbox"></div><button></button></div></div>
<div id="shop"><div class="sbox"><canvas class="sart"></canvas><div class="scard"></div></div></div>

<script>
// ╔══════════════════════════════════════════════════════════════════════════════╗
// ║  MAP ENGINE                                                                 ║
// ╚══════════════════════════════════════════════════════════════════════════════╝
const mc=document.createElement('canvas'),mctx=mc.getContext('2d'),sc=document.getElementById('scene'); // mc: the plane, drawn in 2D every frame; sc: the 3D scene it is laid into
let W=1,H=1,invertMode=false,DUCK_TYPES={}; // what the shared renderers (shared.js) read: the scene size, the colour scheme, the duck types (sent by the surface)
let MW,MH,SW,SH,MK=1,viewZoom=1,_E=0; // MW×MH: the map plane's canvas (bigger than the screen SW×SH, so zooming out and tilting never show its edge); MK: its backing scale
let HEX=34; // T.mapHexSize (tuned in the Esc menu / the surface's Tune menu)
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
let camX=0,camY=0,camTX=0,camTY=0;
let cells={},turn=0,score=0,pQ=0,pR=0,totalCells=0; // turn: how many rings the spill has spread to (merges pull it back)
let clock=3,day=1,pool=6,fresh=true,burstFx=null,dayLog=[],dayCnt={b:0,d:0},pendingEnd=null; // dayLog: how each day ended {day,end,ring,b,d,win}; dayCnt: this day's bright / dark clears; pendingEnd: a day end still falling in
// // clock: the hour (3 = Twilight … 24 = Midnight, the day's last turn); day: your attempts; pool: what the source put out at its last burst; fresh: no ring added yet since it
let constel=[],armed=null,weaveSel=[],weaveAsk=null,clearFx={},mergeFx=[],feedMsg={t:'',d:'',at:-1e9}; // constellations {keys,type}; the armed map item; a Weave being drawn; animations; the final count
const TIMES={3:'Twilight',6:'Dawn',9:'Morning',12:'Noon',15:'Afternoon',18:'Dusk',21:'Night',24:'Midnight'},STEP_H=3; // the day: eight turns of three hours
const CACHE_V='20261102zh'; // the build: bump with shared.js's
const SCENE=new URLSearchParams(location.search).get('scene'); // a Guide / event demo: the map plays a scripted moment (no surface behind it)
let phase='move',turnTimer=0,mergeTimer=0;
let gameOverReason='';
const MIN_VAL=0.01;
let hQ=null,hR=null;
let captureOrder=[],mergeGroups=[],mergeIdCounter=0;
let depth=0,voidOpen=false;
let currentView='map'; // 'map' | 'level' (a surface is open) | 'overlay' (the Guide or an event card)
let nebulaCellKey=null; // the hex whose unfinished surface is saved (one at a time)
let mapRafId=null;
// Shared with the surface: its tuners, the inventory and the discoveries (the surface owns and saves them)
let T={},inv={dim:0},disc=new Set(),tuneDefs=[],nebReady=false,duckLog={};
const MAP_KEY='il_map_v1';

const K=(q,r)=>q+','+r;
const parseK=k=>{const p=k.split(',');return[+p[0],+p[1]];};
const a2w=(q,r)=>[HEX*(Math.sqrt(3)*q+Math.sqrt(3)/2*r),HEX*(3/2*r)];
const w2s=(wx,wy)=>[wx-camX+MW/2,wy-camY+MH/2]; // world → the plane's canvas
const s2w=(sx,sy)=>[sx+camX-MW/2,sy+camY-MH/2];
function p2a(sx,sy){const[wx,wy]=s2w(sx,sy);const q=(Math.sqrt(3)/3*wx-1/3*wy)/HEX,r=(2/3*wy)/HEX;const s=-q-r;let rq=Math.round(q),rr=Math.round(r),rs=Math.round(s);const dq=Math.abs(rq-q),dr=Math.abs(rr-r),ds=Math.abs(rs-s);if(dq>dr&&dq>ds)rq=-rr-rs;else if(dr>ds)rr=-rq-rs;return[rq,rr];}
function dist(q1,r1,q2,r2){return(Math.abs(q1-q2)+Math.abs(q1+r1-q2-r2)+Math.abs(r1-r2))/2}
function cellRing(q,r){return Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r));}
function ring(n){if(!n)return[[0,0]];const res=[];let q=n,r=0;for(let d=0;d<6;d++)for(let i=0;i<n;i++){res.push([q,r]);q+=DIRS[(d+2)%6][0];r+=DIRS[(d+2)%6][1];}return res;}
function neighbors(q,r){return DIRS.map(([dq,dr])=>[q+dq,r+dr]);}
function adjCaptured(q,r){for(const[nq,nr]of neighbors(q,r)){const c=cells[K(nq,nr)];if(c&&c.cap&&c.kind!=='dark')return true;}return false;} // only a bright clear locks its neighbours

function retractToTurn(){
  const maxRing=turn;const toRemove=[];
  for(const k in cells){const c=cells[k];if(c.isVoid||cellRing(c.q,c.r)<=maxRing||c.cap||c.isP)continue;toRemove.push(k);}
  const actual=toRemove.filter(k=>!adjCaptured(cells[k].q,cells[k].r));
  for(const k of actual){delete cells[k];totalCells--;}
  recomputeLocked();
}
function addRing(n){for(const[q,r]of ring(n)){const k=K(q,r);if(n>1&&!neighbors(q,r).some(([a,b])=>{const c=cells[K(a,b)];return c&&cellRing(a,b)<n&&!(c.cap&&c.kind==='dark');}))continue; // a Dark Remnant clear holds the spill back: nothing spreads past it
  if(!cells[k]){cells[k]={q,r,v:0,cap:false,capVal:0,isP:false,locked:false,mergeId:null,isVoid:false};totalCells++;}}}
function recomputeLocked(){for(const k in cells){const c=cells[k];c.locked=(!c.cap&&!c.isVoid&&adjCaptured(c.q,c.r));}}
function dropSession(){ // the unfinished surface is thrown away (values changed, or a new map)
  if(!nebulaCellKey)return;const c=cells[nebulaCellKey];if(c){delete c.shot;delete c._im;}nebulaCellKey=null;neb({cmd:'drop'});
}
function redistribute(){
  recomputeLocked();let exSum=0,exN=0,voidN=0;
  for(const k in cells){const c=cells[k];if(c.isVoid){voidN++;continue;}if(c.cap){exSum+=c.capVal;exN++;}else if(c.locked){exSum+=c.v;exN++;}}
  const freeN=totalCells-exN-voidN;if(freeN<=0)return;
  const pv=(pool-exSum)/freeN;
  for(const k in cells){const c=cells[k];if(c.isVoid||c.cap||c.locked)continue;c.v=Math.round(Math.max(0,pv)*10000)/10000;}
  dropSession(); // moving resets an unfinished surface
}
function decayCycle(){
  let mx=200;
  while(mx-->0){
    let fv=null;for(const k in cells){const c=cells[k];if(!c.cap&&!c.isVoid&&!c.locked){fv=c.v;break;}}
    if(fv===null||fv>=MIN_VAL)break;
    if(captureOrder.length===0){phase='gameover';gameOverReason='all captures dissipated';return;}
    const oldest=captureOrder.shift();
    for(const k of oldest.keys){const c=cells[k];if(!c)continue;c.cap=false;c.capVal=0;c.isVoid=true;c.mergeId=null;c.v=0;delete c.kind;}
    if(oldest.mergeId!=null)mergeGroups=mergeGroups.filter(g=>g.id!==oldest.mergeId);
    hubEvent('map_decay');
    redistribute();
  }
  checkVoidAccess();
}
function detectMerges(){
  let totalRed=0;

  if(now-water.at<500)return;water.at=now;water.pts=[];let n=0;
  for(let j=0;j<7;j++)for(let i=0;i<10;i++){const X=SW*(i+0.5)/10,Y=SH*(0.06+0.9*(j+0.5)/7),w=s2wp(X,Y);n++;if(isWater(w[0],w[1]))water.pts.push(w);}

function spawnLakeDuck(now){
  const roster=duckRoster(),used={};for(const d of pond)used[d.type]=(used[d.type]||0)+1;
  const free=roster.filter((t,i)=>(used[t]||0)<roster.slice(0,i+1).filter(x=>x===t).length);if(!free.length||!water.pts.length)return;
  const type=free[(Math.random()*free.length)|0];

    if(Math.random()<0.3){pond.push({type,x:P[0],y:P[1],hd,sp:0,cur:0,next:now+1500,born:now,splash:true,seen:true,lastRip:0,ph:Math.random()*6.28});ripples.push({x:P[0],y:P[1],t:now,ink:onWhite(P[0],P[1])?'20,24,32':'255,255,255',big:1});return;} // splashes up from under the surface
    let x=P[0],y=P[1],ok=true;for(let k=0;k<80;k++){x-=dx*HEX*0.5;y-=dy*HEX*0.5;if(!isWater(x,y)){ok=false;break;}const[X,Y]=w2sc(x,y);if(offView(X,Y,HEX*1.2))break;} // back along its way until it is off screen
    if(!ok)continue;pond.push({type,x,y,hd,sp:0.45,cur:(Math.random()-0.5)*0.004,next:now+2000+Math.random()*2500,born:now,splash:false,seen:false,lastRip:0,ph:Math.random()*6.28});return;}}
function pondStep(now){
  const c=mctx,dt=Math.min(50,now-(pondT||now))/16.67;pondT=now;if(currentView!=='map')return; // ripples and glows go on the plane; the ducks are drawn in the scene (sceneRender)
  scanWater(now);const want=Math.round(Math.min(T.mapDucks!=null?T.mapDucks:5,duckRoster().length)*Math.min(1,water.frac*2.5)); // a little water on screen: fewer ducks (none for none)
  if(pond.length<want&&now>pondNext){spawnLakeDuck(now);pondNext=now+900+Math.random()*1500;}
  const cw=mX>=0&&!menuOpen&&!shopUI&&overScene()?s2wp(mX,mY):null;let cv=0,ca=0; // the cursor on the water, and how fast it moves (world px per ms)
  if(cw&&_cwPrev&&now>_cwPrev.t){const dx=cw[0]-_cwPrev.x,dy=cw[1]-_cwPrev.y;cv=Math.hypot(dx,dy)/(now-_cwPrev.t);ca=Math.atan2(dy,dx);}_cwPrev=cw?{x:cw[0],y:cw[1],t:now}:null;
  pond=pond.filter(d=>{
    if(cw&&d._s&&!d.dunk&&now-(d.hitAt||0)>400&&Math.hypot(cw[0]-d.x,cw[1]-d.y)<d._s*0.8){d.hitAt=now;const vf=T.mapDuckBumpV!=null?T.mapDuckBumpV:0.35;
      if(cv<vf)d.spin={t0:now,dur:1500,rate:(Math.random()<0.5?-1:1)*(0.12+0.25*cv/vf)}; // a slow touch: it spins where it is
      else{d.hd=ca;d.kick=Math.min(5,1+2.5*cv/vf);d.dash=now+900+Math.min(1500,600*cv/vf);ripples.push({x:d.x,y:d.y,t:now,ink:onWhite(d.x,d.y)?'20,24,32':'255,255,255'});} // a hit: it putters off the way it was pushed
      neb({cmd:'quack',type:d.type,v:Math.min(1,cv/vf/3)});}
    const sp_=d.spin&&now-d.spin.t0<d.spin.dur?d.spin:null;if(sp_)d.hd+=sp_.rate*dt*(1-(now-sp_.t0)/sp_.dur);else d.spin=null;
    const dk=d.dunk?(now-d.dunk)/(T.mapDuckDunkMs||1300):1;let dkS=1; // a dunk: the way a duck splashes up, backwards — it sinks into the water, stays under a moment, then comes back up out of it
    if(dk>=1)d.dunk=0;else if(dk<0.3){const u=dk/0.3;dkS=1-u*u;}else if(dk<0.55)dkS=0;else{if(!d._up){d._up=1;ripples.push({x:d.x,y:d.y,t:now,ink:onWhite(d.x,d.y)?'20,24,32':'255,255,255',big:1});}const u=(dk-0.55)/0.45;dkS=1+2.7*Math.pow(u-1,3)+1.7*Math.pow(u-1,2);} // (up with a little bob past full size)
    if(!d.dunk)d._up=0;
    if(d.kick){d.kick*=Math.pow(0.97,dt);if(d.kick<0.05)d.kick=0;}
    if(now>d.next){d.next=now+1800+Math.random()*3000;d.cur=Math.random()<0.1?(Math.random()<0.5?-1:1)*0.03:(Math.random()-0.5)*0.006;d.dash=Math.random()<0.18?now+1200+Math.random()*1200:0;} // now and then a dash // mostly a gentle curve on its way across; now and then a doughnut
    const paddle=(d.dash>now?1.5:0.38+0.28*Math.max(0,Math.sin(now/260+d.ph)))+(d.kick||0),go=(d.splash&&now-d.born<900)||sp_||d.dunk?0:paddle;d.sp+=(go-d.sp)*(d.kick?0.2:0.05)*dt; // spinning or under water: it stops
    if(!isWater(d.x,d.y)){const l=Math.hypot(d.x,d.y)||1;d.x+=d.x/l*1.6*dt;d.y+=d.y/l*1.6*dt;const out=Math.atan2(d.y,d.x);d.hd+=Math.atan2(Math.sin(out-d.hd),Math.cos(out-d.hd))*0.08*dt;} // the growing spill pushes it out
    else{const ax=d.x+Math.cos(d.hd)*HEX*1.4,ay=d.y+Math.sin(d.hd)*HEX*1.4;if(!isWater(ax,ay)){const out=Math.atan2(d.y,d.x),tan=out+(Math.sin(d.hd-out)>0?1.2:-1.2);d.hd+=Math.atan2(Math.sin(tan-d.hd),Math.cos(tan-d.hd))*0.06*dt;} // the shore ahead: it veers along it
      else d.hd+=d.cur*dt;}
    d.x+=Math.cos(d.hd)*d.sp*dt;d.y+=Math.sin(d.hd)*d.sp*dt;
    const[X,Y,k]=w2sc(d.x,d.y),off=offView(X,Y,HEX*1.5*k);if(!off)d.seen=true;
    if((d.seen&&off)||now-d.born>60000)return false; // gone off screen: another comes in elsewhere
    if(d.sp>0.1&&now-d.lastRip>320){d.lastRip=now;ripples.push({x:d.x,y:d.y,t:now,ink:onWhite(d.x,d.y)?'20,24,32':'255,255,255'});} // white rings on dark water, dark on white
    const t=DUCK_TYPES[d.type]||{},pop=(d.splash?Math.min(1,(now-d.born)/700):1)*dkS;d._s=HEX*0.62*(t.scale||1)/(t.head?1.25:1)*pop;return true;}); // world units per model unit (its type's size; a splash grows it up out of the water)
  ripples=ripples.filter(r=>now-r.t<1800);
  for(const r of ripples){const a=(now-r.t)/1800,[X,Y]=w2s(r.x,r.y),R=4+a*HEX*(r.big?1.6:0.9);c.strokeStyle=`rgba(${r.ink},${(0.5*(1-a)*(1-a)).toFixed(3)})`;c.lineWidth=r.big?2:1.4;c.beginPath();c.arc(X,Y,R,0,6.2832);c.stroke();} // rings on the water (the camera foreshortens them)
  for(const d of pond)if(d._s){const[X,Y]=w2s(d.x,d.y);duckGlow(c,d.type,X,Y,d._s,now,d.ph); // a Bright / Shining / Dim duck lights the water round it
    const r=Math.max(0,Math.min(1,(d.sp-0.6)/0.9)); // paddling hard: the same bow wake a pigment pushes into particles, on the water ahead of it
    if(r>0.02){const ink=onWhite(d.x,d.y)?[20,24,32]:[255,255,255];drawWakeShape(c,X,Y,Math.cos(d.hd),Math.sin(d.hd),d._s*1.4,r,Math.min(0.45,(T.wakeMaxA!=null?T.wakeMaxA:0.35)*1.2*Math.min(1,r*1.6)),ink,ink);}}
}

function saveMap(){
  if(SCENE)return; // a demo never touches your map
  const out={};for(const k in cells){const c=Object.assign({},cells[k]);delete c._im;out[k]=c;}
  const rec=()=>JSON.stringify({v:3,cells:out,turn,clock,day,pool,fresh,constel,dayLog,dayCnt,pendingEnd,score,pQ,pR,totalCells,phase,depth,gameOverReason,captureOrder,mergeGroups,mergeIdCounter,voidOpen,session:nebulaCellKey});
  try{localStorage.setItem(MAP_KEY,rec());}catch(e){for(const k in out)delete out[k].shot;try{localStorage.setItem(MAP_KEY,rec());}catch(x){}} // full: an unfinished hex's picture is the first thing to go
}
function loadMap(){
  let d=null;try{d=JSON.parse(localStorage.getItem(MAP_KEY)||'null');}catch(e){}
  if(!d||!d.cells)return false;
  if(d.v!==3)return false; // a map from before the times of day starts over
  ({cells,turn,clock,day,pool,fresh,constel,dayLog,dayCnt,pendingEnd,score,pQ,pR,totalCells,phase,depth,gameOverReason,captureOrder,mergeGroups,mergeIdCounter,voidOpen}=d);nebulaCellKey=d.session||null;_sunH=clock;dayLog=dayLog||[];dayCnt=dayCnt||{b:0,d:0};
  if(pendingEnd)finishDay();else if(phase==='collapse')phase='move';else if(phase==='ended')showDayReport(); // a day left falling in finishes at once; a won run shows its report
  mapResize();focusCam(false);updateHint();return true;
}

function evPump(){if(currentView!=='map'||menuOpen||!nebReady||!evQ.length)return;const id=evQ.shift();if(disc.has('ev:'+id)){evPump();return;}currentView='overlay';showNeb(true);neb({cmd:'event',id});}

    nebReady=true;buildTune();mapResize();pondSpawn();setTimeout(pvPrune,3000);

let _sf=null;

  clear(){sceneReset();const ks=['1,-1','1,0','0,1','-1,1','2,-1'];ks.forEach((k,i)=>at(700+i*1100,()=>sceneCap(k,i%2?'dark':'bright')));return 7600;},
