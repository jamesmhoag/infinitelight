<script>
// ╔══════════════════════════════════════════════════════════════════════════════╗
// ║  MAP ENGINE                                                                 ║
// ╚══════════════════════════════════════════════════════════════════════════════╝
txtApply(); // the page's own labels (content/strings.csv)
if(!new URLSearchParams(location.search).get('scene'))document.body.classList.add('ui-hidden'); // the panels start hidden (~ shows them)
if(!new URLSearchParams(location.search).get('scene'))loading('boot',true); // until the map is drawn: the surface's word, every hex's picture, the shops (mapReady)
const mc=document.createElement('canvas'),mctx=mc.getContext('2d'),sc=document.getElementById('scene'); // mc: the plane, drawn in 2D every frame; sc: the 3D scene it is laid into
let W=1,H=1,invertMode=false,DUCK_TYPES={}; // what the shared renderers (shared.js) read: the scene size, the colour scheme, the duck types (sent by the surface)
let MW,MH,SW,SH,MK=1,viewZoom=1,_E=0; // MW×MH: the map plane's canvas (bigger than the screen SW×SH, so zooming out and tilting never show its edge); MK: its backing scale
let HEX=34; // T.mapHexSize (tuned in the Esc menu / the surface's Tune menu)
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
let camX=0,camY=0,camTX=0,camTY=0;
let hubPop=[null,null],cells={},turn=0,score=0,pQ=0,pR=0,totalCells=0; // turn: how many rings the spill has spread to (merges pull it back)
let playLog=[],clock=3,day=1,pool=6,burstFx=null,dayLog=[],dayCnt={b:0,d:0},pendingEnd=null; // dayLog: how each day ended {day,end,ring,b,d,win}; dayCnt: this day's bright / dark clears; pendingEnd: a day end still falling in
// // clock: the hour (3 = Twilight … 24 = Midnight, the day's last turn); day: your attempts; pool: what the source put out at its last burst; fresh: no ring added yet since it
let constel=[],armed=null,weaveSel=[],weaveAsk=null,clearFx={},mergeFx=[],feedMsg={t:'',d:'',at:-1e9}; // constellations {keys,type}; the armed map item; a Weave being drawn; animations; the final count
const STEP_H=3; // the day: eight turns of three hours
const CACHE_V='20261127g'; // the build: bump with shared.js's
// The map's chance is seeded: every Math.random on this page comes from one generator whose state (_rs) is part of the map's state, kept in every keyframe of a recording (mapKey).
// A recording played again starts from the same state and takes the same steps (below), so chance falls as it fell: the ducks swim where they swam
let _rs=(Date.now()^Math.round(performance.now()*1000))>>>0;Math.random=()=>{_rs=(_rs+0x6D2B79F5)>>>0;let t=_rs;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};
if(/[?&]scene=replay/.test(location.search)){const n=performance.now.bind(performance),f=window.requestAnimationFrame.bind(window);let g=0,F=null,i=0,cur=0,id=0,pend=[],on=false; // a recording played again: this copy's clock is the recording's own (sceneReplay), so every time it kept still holds —
  performance.now=()=>F?cur:n()+g;window.__clkSet=(t,ft)=>{g=t-n();F=ft&&ft.length?ft:null;i=0;cur=t;}; // and it steps frame by frame through the very times yours was drawn at (ft): each step as long as it was, as many of them, so what depends on the steps comes out the same
  window.requestAnimationFrame=c=>{pend.push([++id,c]);if(!on){on=true;f(()=>{on=false;if(F)cur=i<F.length?Math.max(cur,F[i++]):cur+16.7;const L=pend,t=performance.now();pend=[];for(const p of L)p[1](t);});}return id;};window.cancelAnimationFrame=k=>{pend=pend.filter(p=>p[0]!==k);};} // (every loop of the page takes the same step together)
const SCENE=new URLSearchParams(location.search).get('scene'),SCENE_EV=new URLSearchParams(location.search).get('ev')||'',SCENE_HOLD=!!new URLSearchParams(location.search).get('hold'),REPLAY=SCENE==='replay'; // (REPLAY: a recording played again: your buoy is in it, as it was) // a Guide / event demo: the map plays a scripted moment (no surface behind it)
let phase='move',turnTimer=0,mergeTimer=0;
let gameOverReason='';
let hQ=null,hR=null;
let captureOrder=[],mergeGroups=[],mergeIdCounter=0;
let depth=0,voidOpen=false;
let currentView='map'; // 'map' | 'level' (a surface is open) | 'overlay' (the Guide or an event card)
let nebulaCellKey=null; // the hex whose unfinished surface is saved (one at a time)
let mapRafId=null;
// Shared with the surface: its tuners, the inventory and the discoveries (the surface owns and saves them)
let T={},inv={dim:0},disc=new Set(),tuneDefs=[],nebReady=false,duckLog={},run={},runStatus=null; // run: the surface's run state (today's fortune and wonder…); runStatus: its Status page
const MAP_KEY='il_map_v1';

const K=(q,r)=>q+','+r;
const parseK=k=>{const p=k.split(',');return[+p[0],+p[1]];};
const a2w=(q,r)=>[HEX*(Math.sqrt(3)*q+Math.sqrt(3)/2*r),HEX*(3/2*r)];
const w2s=(wx,wy)=>[wx-camX+MW/2,wy-camY+MH/2]; // world → the plane's canvas
const s2w=(sx,sy)=>[sx+camX-MW/2,sy+camY-MH/2];
function p2a(sx,sy){const[wx,wy]=s2w(sx,sy);const q=(Math.sqrt(3)/3*wx-1/3*wy)/HEX,r=(2/3*wy)/HEX;const s=-q-r;let rq=Math.round(q),rr=Math.round(r),rs=Math.round(s);const dq=Math.abs(rq-q),dr=Math.abs(rr-r),ds=Math.abs(rs-s);if(dq>dr&&dq>ds)rq=-rr-rs;else if(dr>ds)rr=-rq-rs;return[rq,rr];}
function dist(q1,r1,q2,r2){return(Math.abs(q1-q2)+Math.abs(q1+r1-q2-r2)+Math.abs(r1-r2))/2}
function cellRing(q,r){return Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r));}
const hexD=(a,b)=>cellRing(a.q-b.q,a.r-b.r),here=()=>({q:pQ,r:pR}); // hexes apart; where your buoy is
function ring(n){if(!n)return[[0,0]];const res=[];let q=n,r=0;for(let d=0;d<6;d++)for(let i=0;i<n;i++){res.push([q,r]);q+=DIRS[(d+2)%6][0];r+=DIRS[(d+2)%6][1];}return res;}
function neighbors(q,r){return DIRS.map(([dq,dr])=>[q+dq,r+dr]);}
function adjCaptured(q,r){for(const[nq,nr]of neighbors(q,r)){const c=cells[K(nq,nr)];if(c&&c.cap&&c.kind!=='dark')return true;}return false;} // (a bright clear keeps the hexes round it when the map draws in)

function retractToTurn(){
  const maxRing=turn;const toRemove=[];
  for(const k in cells){const c=cells[k];if(c.isVoid||cellRing(c.q,c.r)<=maxRing||c.cap||c.isP)continue;toRemove.push(k);}
  const actual=toRemove.filter(k=>!adjCaptured(cells[k].q,cells[k].r));
  for(const k of actual){delete cells[k];totalCells--;}
  
}
function addRing(n){for(const[q,r]of ring(n)){const k=K(q,r);if(n>1&&!neighbors(q,r).some(([a,b])=>{const c=cells[K(a,b)];return c&&cellRing(a,b)<n&&!(c.cap&&c.kind==='dark')&&!c.rift;}))continue; // a Dark Remnant clear holds the spill back: nothing spreads past it
  if(!cells[k]){cells[k]={q,r,v:0,cap:false,capVal:0,isP:false,mergeId:null,isVoid:false};totalCells++;}}}
function dropSession(){ // the unfinished surface is thrown away (values changed, or a new map)
  if(!nebulaCellKey)return;const c=cells[nebulaCellKey];if(c){delete c.shot;delete c._im;}nebulaCellKey=null;neb({cmd:'drop'});
}
function redistribute(){
  let exSum=0,exN=0,voidN=0;
  for(const k in cells){const c=cells[k];if(c.isVoid){voidN++;continue;}if(c.cap){exSum+=c.capVal;exN++;}else if(c.full){exSum+=c.v;exN++;}}
  const freeN=totalCells-exN-voidN;if(freeN<=0)return;
  const pv=(pool-exSum)/freeN;
  for(const k in cells){const c=cells[k];if(c.isVoid||c.cap||c.full)continue;c.v=Math.round(Math.max(0,pv)*10000)/10000;}
  dropSession(); // moving resets an unfinished surface
}
function detectMerges(){
  let totalRed=0;
  for(const k in cells){const c=cells[k];if(!c.cap||c.isVoid)continue;const ns=neighbors(c.q,c.r);const nKeys=ns.map(([q,r])=>K(q,r));if(!nKeys.every(nk=>{const nc=cells[nk];return nc&&nc.cap&&!nc.isVoid;}))continue;const allKeys=[k,...nKeys];if(allKeys.some(ak=>{const ac=cells[ak];return ac&&ac.mergeId!=null;}))continue;const gid=mergeIdCounter++;mergeGroups.push({id:gid,type:'hex',cells:[...allKeys]});for(const ak of allKeys)if(cells[ak])cells[ak].mergeId=gid;consolidateCaptures(allKeys,gid);totalRed+=3;showMergeFlash(txt('map.hex_merge_rings_3'));}
  const capKeys=Object.keys(cells).filter(k=>{const c=cells[k];return c.cap&&!c.isVoid;});
  for(let i=0;i<capKeys.length;i++){const[q1,r1]=parseK(capKeys[i]);const n1=neighbors(q1,r1).map(([q,r])=>K(q,r)).filter(nk=>capKeys.includes(nk));for(let j=0;j<n1.length;j++){const[q2,r2]=parseK(n1[j]);for(let jj=j+1;jj<n1.length;jj++){const[q3,r3]=parseK(n1[jj]);if(dist(q2,r2,q3,r3)!==1)continue;const triKeys=[capKeys[i],n1[j],n1[jj]].sort();if(triKeys.some(tk=>{const tc=cells[tk];return tc&&tc.mergeId!=null;}))continue;const gid=mergeIdCounter++,d3=triKeys.every(tk=>cells[tk]&&cells[tk].kind==='dark');mergeGroups.push({id:gid,type:d3?'dark3':'tri',cells:[...triKeys]});for(const tk of triKeys)if(cells[tk])cells[tk].mergeId=gid;consolidateCaptures(triKeys,gid);
    if(d3){totalRed+=3;mergeFx.push({gid,t0:performance.now()});showMergeFlash(txt('map.three_dark_remnants_become'));}else{totalRed+=1;showMergeFlash(txt('map.merge_rings_1'));}}}} // three Dark Remnants swirl into one great one: three times the pull
  if(totalRed>0){hubEvent('map_merge');turn-=totalRed;checkConstellations();if(turn<=0){phase='gameover';gameOverReason=txt('map.go.zero');return;}retractToTurn();redistribute();checkVoidAccess();}
}
