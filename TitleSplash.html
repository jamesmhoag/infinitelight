/* =========================
   TUNABLES / PAIR TIMING (shared)
   ========================= */
:root{
  --focus-base: 8s;
  --focus-m1: 1;
  --focus-m2: 1.15;
  --focus-m3: 1.35;
  --focus-delay-1: 0s;
  --focus-delay-2: 0.6s;
  --focus-delay-3: 1.1s;
  --pair1-duration: calc(var(--focus-base) * var(--focus-m1));
  --pair1-delay: var(--focus-delay-1);
  --pair2-duration: calc(var(--focus-base) * var(--focus-m2));
  --pair2-delay: var(--focus-delay-2);
  --pair3-duration: calc(var(--focus-base) * var(--focus-m3));
  --pair3-delay: var(--focus-delay-3);
}

/* =========================
   LAYOUT
   ========================= */
html,body{height:100%;-webkit-user-select:none;user-select:none} /* (a drag never highlights the title's text) */
#water{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none} /* the title's water: under the title, which blends onto it as it does onto the black */
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
.splash-container{
  position:relative;
  font-family:'Spirax',cursive;
  font-size:6rem;
  line-height:1.2;
  text-align:center;
}

/* =========================
   TEXT (main + strokes)
   ========================= */
.text-base{ position:relative;color:white;z-index:40;line-height:1.2;display:inline-block;filter:blur(1px);opacity:1; }
.text-stroke1,.text-stroke2{ position:absolute;top:0; left:0;color:white;line-height:1.2;text-align:center;z-index:30;mix-blend-mode:plus-lighter; }
.text-stroke1{ filter:blur(4px); opacity:0.6; }
.text-stroke2{ filter:blur(16px); opacity:0.4; }

/* =========================
   GLOW LAYERS
   ========================= */
.glow-layer{
  position:absolute;
  top:0; left:0;
  line-height:1.2;text-align:center;
  mix-blend-mode:plus-lighter; z-index:10;
  --init-blur:120px;
  --init-alpha:.45;
  --focus-target-blur:10px;
  --focus-target-alpha:.6;
  --glow-offset-x:0px;
  --glow-offset-y:0px;
  --glow-max-off-x:100px;
  --glow-max-off-y:100px;
  --scale-x:1;
  --scale-y:1;
  --glow-max-scale:1.25;
  --pair-duration: var(--pair1-duration);
  --pair-delay: var(--pair1-delay);
  filter: blur(var(--init-blur));
  opacity: var(--init-alpha);
  animation:
    glowTransform var(--pair-duration) ease-in-out var(--pair-delay) infinite alternate,
    focus var(--pair-duration) ease-in-out var(--pair-delay) infinite alternate;
  transform-origin:center center;
}
.glow-inner{
  display:inline-block;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  text-fill-color:transparent;
  animation: rotateGlow var(--glow-speed,60s) linear infinite;
}
@keyframes rotateGlow{ from{ transform: rotate(0deg); } to{ transform: rotate(360deg); } }

  to{ transform: translate(calc(var(--glow-offset-x,0px)+var(--glow-max-off-x,100px)),calc(var(--glow-offset-y,0px)+var(--glow-max-off-y,100px))) scale(calc(var(--scale-x,1)*var(--glow-max-scale,1.25)),calc(var(--scale-y,1)*var(--glow-max-scale,1.25))); }
}

.glow1{ --init-blur:120px; --init-alpha:0.35; --focus-target-blur:40px; --focus-target-alpha:0.6; --glow-speed:33s; --pair-duration: var(--pair1-duration); --pair-delay: var(--pair1-delay); --glow-offset-x:0px; --glow-offset-y:0px; --glow-max-off-x:100px; --glow-max-off-y:100px; --scale-x:1; --scale-y:1; --glow-max-scale:1.25; }

.glow2 .glow-inner{ animation-direction:reverse; background: conic-gradient(rgba(148,0,211,0.45), rgba(75,0,130,0.45), rgba(0,0,255,0.45), rgba(0,255,0,0.45), rgba(255,255,0,0.45), rgba(255,127,0,0.45), rgba(255,0,0,0.45), rgba(148,0,211,0.45)); }
.glow3{ --init-blur:130px; --init-alpha:0.3; --focus-target-blur:40px; --focus-target-alpha:0.6; --glow-speed:40s; --pair-duration: var(--pair3-duration); --pair-delay: var(--pair3-delay); --glow-offset-x:6px; --glow-offset-y:-6px; --glow-max-off-x:70px; --glow-max-off-y:-80px; --scale-x:0.95; --scale-y:1.05; --glow-max-scale:1.25; }
.glow3 .glow-inner{ background: conic-gradient(rgba(255,0,0,0.45), rgba(255,255,0,0.45), rgba(0,255,255,0.45), rgba(255,0,255,0.45), rgba(255,0,0,0.45)); }

/* =========================

   ========================= */
.ring,.ring-glow1,.ring-glow2,.ring-glow3{ position:absolute;border-radius:50%;mix-blend-mode:plus-lighter;z-index:28;top:-96px;left:22.5px; }

.ring-glow3{ width:282px;height:282px;--ring-rgb:255,0,255;border:3px solid rgba(var(--ring-rgb),0.25);filter:blur(4px);--init-blur:4px;--init-border-alpha:0.25;animation: ringFocus var(--pair3-duration) ease-in-out var(--pair3-delay) infinite alternate; }

.text-pair1{ filter:blur(120px); opacity:0.6; --init-blur:120px; --init-alpha:0.6; animation: focus var(--pair1-duration) ease-in-out var(--pair1-delay) infinite alternate; }
.text-pair2{ filter:blur(120px); opacity:0.6; --init-blur:120px; --init-alpha:0.6; animation: focus var(--pair2-duration) ease-in-out var(--pair2-delay) infinite alternate; }

/* Main menu */
.main-menu{ position:fixed; left:50%; bottom:9vh; transform:translateX(-50%); /* (left: under the ring round Infinite, set by placeMenu) */ display:flex; flex-direction:column; gap:1px; z-index:100; width:240px; background:#000; border:1px solid #fff; padding:14px 22px; } /* as a shop's list on the map */
